spring.application.name=layer

# Load key-value pairs from .env in the project root.
spring.config.import=optional:file:.env[.properties]

# Profile and ports can be overridden from .env
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}
server.port=${CORE_SERVICE_PORT:8081}

# MongoDB connection from environment (Spring Boot 4 key)
spring.mongodb.uri=${MONGO_URI:${CLOUD_MONGO_URI:}}

# Basic actuator exposure for health checks
management.endpoints.web.exposure.include=health,info
